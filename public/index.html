<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Discord</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla de Inicio de Sesión / Registro -->
  <div id="auth-container" class="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">¡Te damos la bienvenida de nuevo!</h2>
      <p id="auth-subtitle">Inicia sesión para entrar al chat</p>
      
      <form id="auth-form">
        <label>NOMBRE DE USUARIO</label>
        <input id="auth-username" type="text" required autocomplete="username" />

        <label>CONTRASEÑA</label>
        <input id="auth-password" type="password" required autocomplete="current-password" />

        <p id="auth-error" class="auth-error"></p>

        <button type="submit" id="auth-submit-btn">Iniciar sesión</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">¿Necesitas una cuenta?</span>
        <a href="#" id="auth-switch-link">Registrarse</a>
      </p>
    </div>
  </div>

  <!-- Pantalla Principal del Chat (oculta hasta iniciar sesión) -->
  <div id="app-container" class="app-container hidden">
    <aside class="sidebar">
      <div class="sidebar-top">
        <h2>Mi Servidor</h2>
        <div class="channel active"># general</div>
      </div>
      
      <div class="user-panel">
        <span id="current-user">Usuario</span>
        <button id="logout-btn" type="button">Salir</button>
      </div>
    </aside>

    <main class="chat-area">
      <header class="chat-header"># general</header>
      <ul id="messages"></ul>
      <form id="chat-form">
        <input id="message-input" type="text" placeholder="Enviar mensaje a #general" autocomplete="off" required />
        <button type="submit">Enviar</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
